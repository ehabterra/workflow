# The expense-approval net: one workflow instance per expense.
#
# submit routes by amount (guards read the workflow context): petty cash
# (<= 100) auto-approves; everything else AND-splits into two parallel
# review branches (legal, finance) that finalize AND-joins. Each pending
# branch escalates after 72h (M4 host-driven timer) but stays
# approvable/rejectable. revise closes the loop: a rejected expense returns
# to draft for resubmission (a cycle; the reject already cancelled the
# sibling branch via its reset arcs, so nothing is stranded). mark_paid is
# fired by the batch payment run (see payment.yaml).
#
# Former modeling frictions, both solved by library features this net now
# uses: reset arcs cancel the sibling branch on rejection, and from_any
# (OR-input) lets one approve/reject serve both the pending and escalated
# stages (docs/roadmap/FRICTION.md, resolved entries 1 and 2).
workflow:
  name: expense_approval
  initial_marking: draft
  places:
    - name: draft
    - name: pending_legal
    - name: pending_finance
    - name: escalated_legal
    - name: escalated_finance
    - name: legal_ok
    - name: finance_ok
    - name: approved
    - name: rejected
    - name: paid
  transitions:
    - name: submit_auto
      from: [draft]
      to: [approved]
      guard: "amount <= 100.0"
    - name: submit
      from: [draft]
      to: [pending_legal, pending_finance]
      guard: "amount > 100.0"
    # ONE approve/reject per branch: from_any (OR-input) accepts the token
    # from whichever stage holds it — pending or escalated — consuming only
    # that stage. This collapsed four *_escalated twin transitions (friction
    # log, resolved entry 2).
    - name: legal_approve
      from: [pending_legal, escalated_legal]
      to: [legal_ok]
      from_any: true
    - name: finance_approve
      from: [pending_finance, escalated_finance]
      to: [finance_ok]
      from_any: true
    - name: legal_escalate
      from: [pending_legal]
      to: [escalated_legal]
      after: 72h
    - name: finance_escalate
      from: [pending_finance]
      to: [escalated_finance]
      after: 72h
    # Rejecting one branch CANCELS the other via reset arcs: the sibling's
    # pending/escalated token — and any escalation timer running on it —
    # dies in the same atomic firing. (This replaced host-side ClearPlace
    # token surgery; see docs/roadmap/FRICTION.md, resolved entry 1.)
    - name: legal_reject
      from: [pending_legal, escalated_legal]
      to: [rejected]
      from_any: true
      resets: [pending_finance, escalated_finance, finance_ok]
    - name: finance_reject
      from: [pending_finance, escalated_finance]
      to: [rejected]
      from_any: true
      resets: [pending_legal, escalated_legal, legal_ok]
    - name: finalize
      from: [legal_ok, finance_ok]
      to: [approved]
    - name: revise
      from: [rejected]
      to: [draft]
    - name: mark_paid
      from: [approved]
      to: [paid]
