{{template "head" "Submit expense"}}
<h1>Submit an expense</h1>
<form method="post" action="/expenses">
  <p><label>Submitter <input name="submitter" required></label></p>
  <p><label>Description <input name="description" size="40"></label></p>
  <p><label>Amount <input name="amount" type="number" step="0.01" min="0.01" required></label></p>
  <p><button type="submit">Submit</button></p>
</form>
<p class="muted">Submitting AND-splits the expense into parallel legal and finance review. Amounts over 5000 will be held by the payment guard for manual review.</p>
{{template "foot"}}
