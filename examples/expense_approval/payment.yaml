# The payment net: ONE long-lived instance for the whole system (the
# CPN-flavored component). Every approved expense becomes a colored token in
# `payable` carrying {expense_id, amount, submitter}; the batch run fires
# `pay` per token. The guard holds back large amounts — those tokens stay in
# `payable` until a reviewer fires `release` on them individually (manual
# review, actor recorded in the audit trail).
#
# There is deliberately no initial_marking: a pure token-pool net starts
# EMPTY, and between batches every place is legitimately empty again. An
# empty marking persists and reloads fine, so the always-marked
# `batch_control` anchor place this net once needed is gone (friction
# entry #3, fixed in the library; see docs/roadmap/SHARED_POOL_MODELING.md).
workflow:
  name: payment_batch
  places:
    - name: payable
    - name: paid_out
  transitions:
    - name: pay
      from: [payable]
      to: [paid_out]
      guard: "token.amount <= 5000.0"
      metadata: {diagram_class: auto}
    - name: release
      from: [payable]
      to: [paid_out]
      metadata:
        manual: true
        diagram_class: person
        description: reviewer-approved payout of a guard-held token
