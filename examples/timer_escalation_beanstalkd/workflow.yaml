workflow:
  name: approval
  # A request rests in `submitted` until a human approves it. If nobody acts
  # within three days, the timed `escalate` transition becomes *due*. A host
  # dispatcher finds it via ListDue and hands the work to a worker over
  # Beanstalkd — no goroutine or internal scheduler in the library itself.
  initial_marking: submitted
  places:
    - name: submitted
    - name: approved
    - name: escalated
  transitions:
    - name: approve
      from: [submitted]
      to: [approved]
    - name: escalate
      from: [submitted]
      to: [escalated]
      after: 72h   # host-driven timer (roadmap M4): due 72h after the token entered `submitted`
