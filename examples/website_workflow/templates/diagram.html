<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Diagram</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({
            startOnLoad: true,
            securityLevel: 'loose',
            theme: 'neutral',
            flowchart: { htmlLabels: true, padding: 16, curve: 'basis' }
        });
    </script>
    <style>
        .dir-switcher { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; font-size: 13px; }
        .dir-switcher .lbl { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; color: #6b7280; margin-right: 4px; }
        .dir-switcher a { color: #6b7280; text-decoration: none; border: 1px solid #d1d5db; border-radius: 99px; padding: 4px 12px; font-family: ui-monospace, monospace; }
        .dir-switcher a:hover { border-color: #6b7280; color: #111827; }
        .dir-switcher a.on { color: #14532d; border-color: #15803d; background: #dcfce7; }
        .mermaid { overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Workflow Diagram</h1>
            <a href="/" class="back-link">← Back to List</a>
        </div>

        <div class="card">
            <div class="dir-switcher">
                <span class="lbl">flow</span>
                <a{{if eq .Dir "TD"}} class="on"{{end}} href="?dir=TD">↓ top-down</a>
                <a{{if eq .Dir "LR"}} class="on"{{end}} href="?dir=LR">→ left-right</a>
                <a{{if eq .Dir "BT"}} class="on"{{end}} href="?dir=BT">↑ bottom-up</a>
                <a{{if eq .Dir "RL"}} class="on"{{end}} href="?dir=RL">← right-left</a>
            </div>
            <div class="mermaid">
{{.Diagram | safeHTML}}
            </div>
        </div>
    </div>
</body>
</html>
