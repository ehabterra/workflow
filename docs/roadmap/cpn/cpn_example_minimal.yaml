# Minimal CPN Workflow Example
# This demonstrates the basic structure of a CPN workflow

workflow:
  name: simple_cpn_workflow
  initial_place: start
  
  # Define token schemas (required)
  token_schemas:
    # Simple unit token (no data)
    unit: {}
    
    # Token with data
    item:
      item_id: string
      status: string
      value: number
  
  # Define places (required)
  places:
    - name: start
      token_schema: unit
      metadata:
        description: "Starting place"
    
    - name: processing
      token_schema: item
      metadata:
        description: "Processing place"
    
    - name: completed
      token_schema: item
      metadata:
        description: "Completed place"
  
  # Define transitions (required)
  transitions:
    # Simple transition: move unit token from start to processing
    - name: start_processing
      from: [start]
      to: [processing]
      token_selection: first
      token_transform:
        processing: |
          {
            "item_id": "item-001",
            "status": "processing",
            "value": 100
          }
        start: null
    
    # Transition with guard: process item
    - name: complete
      from: [processing]
      to: [completed]
      token_selection: first
      guard: |
        token.status == "processing"
      token_transform:
        completed: |
          {
            "item_id": token.item_id,
            "status": "completed",
            "value": token.value
          }
        processing: null

