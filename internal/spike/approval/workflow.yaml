# The requisition-approval net — the DECLARATIVE half of the coverage spike
# (see COVERAGE.md). This is everything about the workflow that the library
# can express today.
#
# Since #35 the guards no longer read pre-computed booleans. `ready` and
# `sod_ok` are gone: `tx_guard:` expressions ask the database inside the firing
# transaction. What the host still injects is org data — `role`, `last_resort`,
# and the `chain` the role ladder produces — because roles and hierarchies are
# deliberately outside this library (docs/BOUNDARIES.md). The chain's INPUT is
# verified in the transaction all the same: `amountOf() == amount` refuses to
# count approvals against a chain derived from a value that has since moved.
#
# approve is three transitions with complementary conditions because one action
# has three outcomes, and ApplyAny picks between them in declaration order:
#
#   approve_last_resort  an admin completing a chain nobody can satisfy
#   approve_final        this approval satisfies the chain
#   approve_partial      it does not (yet)
#
# Nothing in the host decides which: approve_final is simply not ENABLED until
# the approvals pool holds one token per required role.
workflow:
  name: requisition_approval
  initial_marking: draft
  places:
    - name: draft
      metadata: {status: Draft, editable: true}
    - name: submitted
      metadata: {status: Submitted}
    # approvals is a token POOL, not a state: one colored token per approval,
    # carrying the approver's role. It is the ledger, and it is what the
    # dynamic-cardinality join counts. It carries no status metadata precisely
    # because it is not a state the record is "in".
    - name: approvals
    - name: approved
      metadata: {status: Approved}
    - name: rejected
      metadata: {status: Rejected, editable: true}
    - name: superseded
      metadata: {status: Superseded}
  transitions:
    # THE TRANSACTION-SCOPED GUARD (#35).
    #
    # The ready-gate — every costed line carries a cost code — is a query, and
    # until #35 a guard could not make one. The host ran it, injected the answer
    # as a `ready` boolean, and hoped no line changed before the save.
    # `tx_guard:` is evaluated INSIDE the firing transaction, so it asks at the
    # moment it decides, against the state it is about to commit against.
    - name: submit
      from: [draft]
      to: [submitted]
      tx_guard: "readyGate()"
      effects:
        - name: project_status
        - name: audit
          params: {action: "requisition.submit"}
        - name: notify
          params: {target: "approvers", kind: "submitted"}
      after_commit:
        - name: email
          params: {to: "approvers", template: "submitted"}

    # An admin may complete a chain that contains a role nobody holds — without
    # it such a requisition is unapprovable. It is tried FIRST because it is the
    # narrowest condition.
    #
    # It carries the SAME tx_guard as every other approve branch, and that is
    # the point. Two earlier versions got this wrong: one omitted `sod_ok`, so an
    # admin could approve their own requisition; the next omitted the amount
    # check, so an admin could approve on a chain derived from a value that had
    # since moved — `last_resort` is itself derived from that chain. A branch
    # that exists to break a deadlock is not a branch that gets to skip the
    # rules, and identical text on all three is how you can see that at a glance.
    - name: approve_last_resort
      from: [submitted, approvals]
      to: [approved]
      guard: "last_resort"
      tx_guard: "sodOk() && amountOf() == amount"
      resets: [approvals]
      effects:
        - name: project_status
        - name: supersede_prior
        - name: stamp_approver
        - name: audit
          params: {action: "requisition.approve", detail: "last-resort"}
        - name: notify
          params: {target: "submitter", kind: "approved"}
        - name: outbox
          params: {event: "requisition.approved"}
      after_commit:
        - name: email
          params: {to: "submitter", template: "approved"}

    # THE DYNAMIC-CARDINALITY JOIN (#34).
    #
    # Wait until the approvals pool holds one token per role the chain requires
    # — where the chain's LENGTH is len(chain), a runtime value. Before #34 this
    # was `chain_satisfied`, a boolean the host computed by reading its own
    # ledger table and simulating the approval it was about to write.
    #
    # `distinct: role` is what makes two approvals from one role count once, and
    # `where` is what makes an out-of-chain approval count never — so chain
    # membership is structural instead of a check the host must remember.
    #
    # The reset arc discards the pool with the same firing; the tokens the join
    # selected have already flowed to `approved`.
    - name: approve_final
      from: [submitted, approvals]
      to: [approved]
      tx_guard: "sodOk() && amountOf() == amount"
      resets: [approvals]
      require:
        - place: approvals
          where: "token.role in chain"
          distinct: role
          count: "len(chain)"
      effects:
        - name: project_status
        - name: supersede_prior
        - name: stamp_approver
        - name: audit
          params: {action: "requisition.approve"}
        - name: notify
          params: {target: "submitter", kind: "approved"}
        - name: outbox
          params: {event: "requisition.approved"}
      after_commit:
        - name: email
          params: {to: "submitter", template: "approved"}

    # The approval landed but the chain is not satisfied yet. The self-loop
    # records progress without advancing; the approval token itself is already
    # in the pool, added inside the same atomic cycle.
    #
    # `role in chain` is the authorization check, over host-supplied org data.
    # Because the token was added inside the fire, a rejected approval is never
    # persisted at all.
    - name: approve_partial
      from: [submitted]
      to: [submitted]
      guard: "role in chain"
      tx_guard: "sodOk() && amountOf() == amount"
      effects:
        - name: project_status
        - name: audit
          params: {action: "requisition.approve", detail: "pending"}
        - name: notify
          params: {target: "approvers", kind: "approval_pending"}

    # Rejecting clears the pool: the approvals collected so far do not survive
    # a rejection, and the reset arc says so in one place.
    - name: reject
      from: [submitted]
      to: [rejected]
      resets: [approvals]
      effects:
        - name: project_status
        - name: audit
          params: {action: "requisition.reject"}
        - name: notify
          params: {target: "submitter", kind: "rejected"}
      after_commit:
        - name: email
          params: {to: "submitter", template: "rejected"}

    - name: resubmit
      from: [rejected]
      to: [draft]
      effects:
        - name: project_status
        - name: audit
          params: {action: "requisition.resubmit"}

    # revoke is the deliberate act of retiring an approved requisition.
    #
    # There was a second transition here — `supersede`, for what happens to a
    # prior approved requisition when a newer one is approved. It was DEAD: the
    # cascade cannot fire it (friction 5), so it is done with raw SQL instead,
    # and nothing ever applied it. The library did not notice, and neither did
    # the tests; a reviewer did. It is removed, and the episode is recorded in
    # COVERAGE.md as unplanned evidence for the static-validation gap (#42).
    - name: revoke
      from: [approved]
      to: [superseded]
      effects:
        - name: project_status
        - name: audit
          params: {action: "requisition.revoke"}
        - name: outbox
          params: {event: "requisition.revoked", reversal: true}
